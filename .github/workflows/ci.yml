name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags are mutable).
jobs:
  verify:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build

  test:
    name: Unit, integration and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_password
          POSTGRES_DB: nexora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://nexora:nexora_ci_password@localhost:5432/nexora_test
      TEST_REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgresql://nexora:nexora_ci_password@localhost:5432/nexora_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Applies every migration to an empty database (Vitest global setup), then runs all suites.
      - name: Unit and integration tests
        run: pnpm run test

      - name: Migration drift check (schema.prisma vs. migrated database)
        run: pnpm --filter @nexora/api run db:check-drift
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Install Playwright browser
        run: pnpm --filter @nexora/admin exec playwright install --with-deps chromium

      - name: End-to-end tests (desktop, tablet, mobile)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  compat:
    name: Node.js ${{ matrix.node }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The primary jobs use .nvmrc (22 LTS). 24 is the other LTS line; 23.7.0 is an end-of-life
        # release kept working because contributors use it (see docs/development/getting-started.md).
        node: ['24', '23.7.0']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_password
          POSTGRES_DB: nexora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://nexora:nexora_ci_password@localhost:5432/nexora_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies must have no high or critical advisories.
      - run: pnpm audit --prod --audit-level=high
      # Development dependencies are reported but do not fail the build.
      - run: pnpm audit || true

  docker:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API runtime image
        run: docker build -f infrastructure/docker/api.Dockerfile --target runtime -t nexora/api:ci .
      - name: Build API migrator image
        run: docker build -f infrastructure/docker/api.Dockerfile --target migrator -t nexora/api-migrator:ci .
      - name: Build admin image
        run: docker build -f infrastructure/docker/admin.Dockerfile -t nexora/admin:ci .
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci docker compose --profile app config --quiet
