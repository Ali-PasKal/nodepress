# NEXORA admin: serves the static SPA under /admin/ and reverse-proxies /api/ to the API service, so the
# browser talks to a single origin (no CORS, SameSite=Strict-compatible cookies).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  # Emit relative Location headers so redirects work behind any port mapping or outer proxy.
  absolute_redirect off;
  root /usr/share/nginx/html;
  charset utf-8;

  # Bound request size and slow clients. Keep client_max_body_size >= the API's REQUEST_BODY_LIMIT.
  client_max_body_size 1m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /admin/healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 302 /admin/;
  }

  location = /admin {
    return 301 /admin/;
  }

  # Content-hashed build assets never change: cache them for a year.
  location /admin/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA routes fall back to index.html; the HTML shell is always revalidated.
  location /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /admin/index.html;
  }

  # Media uploads: one file of up to MEDIA_MAX_UPLOAD_MB (default 25 MB) plus multipart overhead.
  # Keep this >= MEDIA_MAX_UPLOAD_MB; the request is streamed to the API instead of buffered here.
  location = /api/v1/media {
    client_max_body_size 30m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  # Uploaded files (served by the API from the configured storage driver).
  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port; the API's CSRF check compares Origin (which includes it) with Host.
    proxy_set_header Host $http_host;
    # This nginx is the edge in the compose topology: overwrite (do not append to) forwarding headers
    # so clients cannot spoof their address or request id.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Public site rendering is not served by this container.
  location / {
    return 404;
  }
}
